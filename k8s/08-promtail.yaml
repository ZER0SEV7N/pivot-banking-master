apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: pivot-banking
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://pivot-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: pivot-banking-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: pivot-banking
              __path__: /var/log/pods/pivot-banking_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>\S+)\s+\[(?P<service>[^\]]+)\] \[corrId=(?P<correlationId>[^\]]+)\] (?P<logger>\S+) - (?P<message>.*)$'
          - labels:
              level:
              service:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pivot-promtail
  namespace: pivot-banking
spec:
  selector:
    matchLabels:
      app: pivot-promtail
  template:
    metadata:
      labels:
        app: pivot-promtail
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - "-config.file=/etc/promtail/promtail.yml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers