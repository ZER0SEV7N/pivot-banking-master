apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: pivot-banking
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://pivot-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: pivot-banking-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: pivot-banking
              __path__: /var/log/pods/pivot-banking_*/*/*.log
        relabel_configs:
          # service = nombre del Deployment a partir del nombre del pod
          # (pivot-ms-customer-6b9f7c8d5-x2k4m -> pivot-ms-customer)
          - source_labels: ['__path__']
            regex: '.*/pivot-banking_(?P<service>[a-z0-9][a-z0-9-]+)-[a-z0-9]+-[a-z0-9]+/.*'
            target_label: service
            replacement: '$1'
        pipeline_stages:
          # Docker Desktop escribe los logs de los pods en formato Docker JSON.
          # En un cluster con containerd/CRI, reemplazar por: - cri: {}
          - docker: {}
          - regex:
              expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>\S+)\s+\[(?P<service>[^\]]+)\] \[corrId=(?P<correlationId>[^\]]+)\]( \[traceId=(?P<traceId>[^\]]+) spanId=(?P<spanId>[^\]]+)\])? (?P<logger>\S+) - (?P<message>.*)\s*$'
          - timestamp:
              source: timestamp
              format: '2006-01-02 15:04:05.000'
          - labels:
              service:
              level:
              correlationId:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pivot-promtail
  namespace: pivot-banking
spec:
  selector:
    matchLabels:
      app: pivot-promtail
  template:
    metadata:
      labels:
        app: pivot-promtail
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - "-config.file=/etc/promtail/promtail.yml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers