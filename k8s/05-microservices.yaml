apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: pivot-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-auth
  template:
    metadata:
      labels:
        app: ms-auth
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: ms-auth
          image: pivot/ms-auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: pivot-config
            - secretRef:
                name: pivot-secrets
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://ms-config:8888"
            - name: EUREKA_URI
              value: "http://ms-eureka:8761/eureka/"
            - name: MONGODB_URI
              value: "mongodb://pivot-mongodb:27017/db_pivot_auth"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-auth
  namespace: pivot-banking
spec:
  selector:
    app: ms-auth
  ports:
    - port: 8085
      targetPort: 8085
---
