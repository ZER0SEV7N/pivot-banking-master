apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-config
  namespace: pivot-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-config
  template:
    metadata:
      labels:
        app: ms-config
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-config
          image: pivot/ms-config:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          # Necesario para LOG_PATH=/tmp/pivot-logs.
          # Sin esto logback intenta escribir en ../ENVIROMENT/logs y la app muere.
          envFrom:
            - configMapRef:
                name: pivot-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-config
  namespace: pivot-banking
spec:
  selector:
    app: ms-config
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-eureka
  namespace: pivot-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-eureka
  template:
    metadata:
      labels:
        app: ms-eureka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-eureka
          image: pivot/ms-eureka:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: pivot-config
          env:
            # El application.yaml del jar NO define server.port (lo tomaba del
            # Config Server). Si el Config Server no responde, Eureka arranca
            # en el puerto 8080 y nunca en 8761. Lo fijamos por entorno.
            - name: SERVER_PORT
              value: "8761"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://ms-config:8888"
            # El servidor Eureka no debe registrarse ni buscar registro en si mismo.
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "ms-eureka"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-eureka
  namespace: pivot-banking
spec:
  type: LoadBalancer
  selector:
    app: ms-eureka
  ports:
    - port: 8761
      targetPort: 8761
