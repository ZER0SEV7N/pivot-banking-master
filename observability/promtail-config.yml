server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pivot-microservices-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: pivot-banking
          __path__: /var/log/pivot/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>\S+)\s+\[(?P<service>[^\]]+)\] \[corrId=(?P<correlationId>[^\]]+)\] (?P<logger>\S+) - (?P<message>.*)$'
      - labels:
          level:
          service: