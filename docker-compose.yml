services:
  pivot-mongodb:
    image: mongo:7.0
    container_name: pivot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - pivot_mongo_data:/data/db
    networks:
      - pivot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pivot-redis:
    image: redis:7.4-alpine
    container_name: pivot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - pivot_redis_data:/data
    networks:
      - pivot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pivot-kafka:
    image: apache/kafka:3.8.0
    container_name: pivot-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pivot-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@pivot-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pivot-network

  pivot-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pivot-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: pivot-banking-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: pivot-kafka:29092
    depends_on:
      - pivot-kafka
    networks:
      - pivot-network

  loki:
    image: grafana/loki:3.0.0
    container_name: pivot-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pivot-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: pivot-promtail
    restart: unless-stopped
    volumes:
      # Logs de cada microservicio: <workspace>/ms-*/logs/*.log
      - ..:/workspace:ro
      # Copias manuales de logs dentro de ENVIROMENT/logs
      - ./logs:/var/log/pivot:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - pivot-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: pivot-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"   # Tempo HTTP API / Grafana datasource
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - pivot_tempo_data:/var/tempo
    networks:
      - pivot-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: pivot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/pivot-banking-grafana-dashboard.json
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - tempo
    networks:
      - pivot-network

volumes:
  pivot_mongo_data:
    driver: local
  pivot_redis_data:
    driver: local
  pivot_tempo_data:
    driver: local

networks:
  pivot-network:
    driver: bridge